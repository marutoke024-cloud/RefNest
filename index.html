<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>イラスト資料管理</title>
<style>
  :root{
    --bg:#15171c; --panel:#1d2027; --panel2:#262a33; --line:#343a45;
    --text:#e6e8ec; --muted:#9aa1ad; --accent:#5b8cff; --accent2:#3a6bd6;
    --danger:#e0524a; --ok:#3ec98a; --folder:#e8b558;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    font-size:14px;display:flex;flex-direction:column;height:100vh;
  }
  button{font-family:inherit;cursor:pointer}
  header{
    display:flex;align-items:center;gap:10px;padding:8px 14px;
    background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;z-index:30;flex-wrap:wrap;
  }
  body.header-hidden header{display:none}
  .logo{font-weight:700;letter-spacing:.5px;font-size:15px;margin-right:6px;white-space:nowrap}
  .logo span{color:var(--accent)}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:none;color:var(--muted);padding:7px 16px;font-size:13px;font-weight:600}
  .seg button.active{background:var(--accent);color:#fff}
  .btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent2)}
  .btn.danger{color:var(--danger);border-color:transparent}
  .btn.danger:hover{border-color:var(--danger)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:4px 9px;font-size:12px}
  .spacer{flex:1}
  .hint{color:var(--muted);font-size:12px}
  select.board-select{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;max-width:180px;
  }
  /* floating header toggle */
  #showHeaderBtn{
    position:fixed;top:8px;left:10px;z-index:45;display:none;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.4);
  }
  body.header-hidden #showHeaderBtn{display:block}

  main{flex:1;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;display:none}
  .view.active{display:block}

  /* ---- Gallery ---- */
  #galleryView{overflow:auto;padding:14px 18px 30px;display:flex;flex-direction:column}
  .gal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px}
  .crumb{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:5px 11px;border-radius:7px;cursor:pointer;font-weight:600;
  }
  .crumb:hover{border-color:var(--accent)}
  .crumb.drop{border-color:var(--ok);background:rgba(62,201,138,.15)}
  .crumb-sep{color:var(--muted)}
  .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
  .folder-card{
    background:var(--panel);border:2px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;cursor:pointer;transition:border-color .12s,background .12s;
  }
  .folder-card:hover{border-color:var(--accent)}
  .folder-card.drop{border-color:var(--ok);background:rgba(62,201,138,.12)}
  .folder-card .ficon{font-size:46px;text-align:center;padding:22px 0 8px;color:var(--folder)}
  .folder-card .fmeta{display:flex;align-items:center;gap:4px;padding:6px 8px 8px}
  .folder-card .fname{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card{
    background:var(--panel);border:2px solid var(--line);border-radius:12px;overflow:hidden;
    transition:border-color .12s, transform .12s;position:relative;
  }
  .card.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.25)}
  .card.dragging{opacity:.4}
  .card .imgwrap{position:relative;width:100%;aspect-ratio:1/1;background:#0d0f13;cursor:pointer;overflow:hidden}
  .card .imgwrap img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .card .badge{
    position:absolute;top:8px;left:8px;background:rgba(91,140,255,.92);color:#fff;
    width:24px;height:24px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:5;
  }
  .card.selected .badge{display:flex}
  .card .cmt-count{
    position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;
    border-radius:12px;padding:2px 9px;font-size:11px;font-weight:600;z-index:5;
  }
  .card .meta{display:flex;align-items:center;gap:6px;padding:8px 10px}
  .card .meta .name{flex:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn{background:transparent;border:none;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px}
  .iconbtn:hover{background:var(--panel2);color:var(--text)}
  .iconbtn.del:hover{color:var(--danger)}
  .empty{text-align:center;color:var(--muted);margin-top:10vh}
  .empty .big{font-size:46px;margin-bottom:12px;opacity:.5}

  /* ---- Board ---- */
  #boardView{background:radial-gradient(circle at center, #1a1d24 0%, #121419 100%);touch-action:none;cursor:grab}
  #boardView.panning{cursor:grabbing}
  #boardCanvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .board-item{position:absolute;top:0;left:0;user-select:none}
  .board-item img{display:block;width:100%;height:100%;object-fit:contain;
    box-shadow:0 4px 20px rgba(0,0,0,.5);border-radius:4px;pointer-events:none}
  .board-item.sel{outline:2px solid var(--accent);outline-offset:2px}
  .board-item .handle{
    position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;background:var(--accent);
    border:2px solid #fff;border-radius:50%;cursor:nwse-resize;display:none;z-index:6;
  }
  .board-item.sel .handle{display:block}
  .board-item .item-toolbar{position:absolute;left:0;top:-32px;display:none;gap:4px;flex-wrap:nowrap}
  .board-item.sel .item-toolbar{display:flex}
  .item-toolbar button{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;
    font-size:11px;padding:3px 7px;font-weight:600;white-space:nowrap;
  }
  .item-toolbar button:hover{border-color:var(--accent)}
  .board-bubble{
    position:absolute;transform:translate(-50%,-100%);background:rgba(28,32,40,.82);color:#fff;
    border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:5px 9px;
    font-size:12px;max-width:170px;line-height:1.4;pointer-events:none;backdrop-filter:blur(3px);
    box-shadow:0 3px 10px rgba(0,0,0,.4);z-index:3;
  }
  .tail-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
  .board-toolbar{
    position:fixed;left:14px;bottom:14px;
    display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);
    padding:8px 10px;border-radius:12px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.4);flex-wrap:wrap;max-width:calc(100vw - 28px);
  }
  .board-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;pointer-events:none}

  /* ---- Modal ---- */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-bg.open{display:flex}
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(900px,96vw);max-height:92vh;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .modal-head h3{margin:0;font-size:15px;flex:1}
  .modal-body{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start;background:#0d0f13}
  .editor-stage{position:relative;display:inline-block;max-width:100%}
  .editor-stage img#editorImg{max-width:100%;max-height:70vh;display:block;border-radius:6px}
  .edit-bubble{
    position:absolute;transform:translate(-50%,-100%);background:rgba(28,32,40,.85);color:#fff;
    border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:6px 10px;font-size:13px;
    min-width:40px;max-width:200px;cursor:move;backdrop-filter:blur(3px);line-height:1.4;z-index:4;
  }
  .edit-bubble textarea{width:160px;background:transparent;border:none;color:#fff;font-family:inherit;font-size:13px;resize:none;outline:none}
  .edit-bubble .bub-tools{position:absolute;top:-26px;right:-6px;display:flex;gap:3px}
  .edit-bubble .bub-tools button{
    width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:#fff;font-size:11px;padding:0;
  }
  .edit-bubble .bub-tools button.del:hover{background:var(--danger)}
  .tip-handle{
    position:absolute;width:15px;height:15px;border-radius:50%;background:var(--ok);
    border:2px solid #fff;transform:translate(-50%,-50%);cursor:move;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .modal-foot{padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);padding:10px 16px;border-radius:10px;z-index:200;opacity:0;transform:translateY(10px);
    transition:.25s;pointer-events:none;font-size:13px;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  input[type=file]{display:none}
</style>
</head>
<body>
<button id="showHeaderBtn" onclick="App.toggleHeader()">▼ メニューを表示</button>
<header>
  <div class="logo">Illust<span>Ref</span></div>
  <div class="seg">
    <button id="tabGallery" class="active" onclick="App.setView('gallery')">ギャラリー</button>
    <button id="tabBoard" onclick="App.setView('board')">ボード</button>
  </div>

  <div id="galCtrls" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn primary" onclick="document.getElementById('fileInput').click()">＋ 画像を追加</button>
    <button class="btn" onclick="App.newFolder()">📁 フォルダ作成</button>
    <span class="hint" id="selInfo">0枚選択中</span>
    <button class="btn" onclick="App.clearSelection()">選択解除</button>
    <button class="btn primary" id="openBoardBtn" onclick="App.openSelectedInBoard()">選択をボードで開く →</button>
  </div>

  <div id="boardCtrls" style="display:none;gap:8px;align-items:center;flex-wrap:wrap">
    <select class="board-select" id="boardSelect" onchange="App.switchBoard(this.value)"></select>
    <button class="btn" onclick="App.newBoard()">＋ 新規ボード</button>
    <button class="btn" onclick="App.renameBoard()">名称変更</button>
    <button class="btn danger" onclick="App.deleteBoard()">削除</button>
  </div>

  <div class="spacer"></div>
  <button class="btn" onclick="App.toggleHeader()">▲ 隠す</button>
  <button class="btn danger" onclick="App.resetAll()">全データ初期化</button>
  <input type="file" id="fileInput" accept="image/*" multiple onchange="App.onUpload(event)">
</header>

<main>
  <section id="galleryView" class="view active">
    <div class="gal-bar">
      <div class="crumbs" id="crumbs"></div>
    </div>
    <div id="galGrid" class="gal-grid"></div>
    <div id="galEmpty" class="empty" style="display:none">
      <div class="big">🖼️</div>
      <div>このフォルダは空です。「＋ 画像を追加」やクリップボードからの貼り付け(Ctrl+V)で追加できます。</div>
    </div>
  </section>

  <section id="boardView" class="view">
    <div id="boardCanvas"></div>
    <div id="boardEmpty" class="board-empty">
      <div>このボードには画像がありません。<br>ギャラリーで選択して送るか、Ctrl+Vで貼り付け追加できます。</div>
    </div>
    <div class="board-toolbar">
      <button class="btn" onclick="App.toggleAllComments()" id="allCmtBtn">💬 コメント一括表示</button>
      <button class="btn" onclick="App.boardFit()">画面に合わせる</button>
      <button class="btn" onclick="App.boardZoom(1.2)">＋</button>
      <button class="btn" onclick="App.boardZoom(1/1.2)">－</button>
    </div>
  </section>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <h3>コメント編集</h3>
      <button class="btn" onclick="App.addBubbleCenter()">＋ 吹き出しを追加</button>
      <button class="btn primary" onclick="App.closeModal()">完了</button>
    </div>
    <div class="modal-body">
      <div class="editor-stage" id="editorStage">
        <img id="editorImg" src="" alt="">
      </div>
    </div>
    <div class="modal-foot">
      画像クリックで吹き出し追加 / 本体ドラッグで移動・テキスト直接編集・✕で削除 / 緑のハンドルで尻尾の向き・長さを調整
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const SVGNS="http://www.w3.org/2000/svg";
const LS_KEY="illustRefApp.v2";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let state={
  images:[],   // {id,src,name,folderId,comments:[{id,x,y,text,tx,ty}]}
  folders:[],  // {id,name,parentId}
  boards:[],   // {id,name,showAllComments,camera,items:[{imageId,x,y,scale,showComments,flipH,flipV}]}
  currentBoardId:null, currentFolderId:null, currentView:"gallery"
};
let selected=new Set();
let editingImageId=null;

function load(){
  try{
    const raw=localStorage.getItem(LS_KEY)||localStorage.getItem("illustRefApp.v1");
    if(raw) Object.assign(state, JSON.parse(raw));
  }catch(e){ console.warn(e); }
  state.folders=state.folders||[];
  // normalize
  state.images.forEach(im=>{ if(im.folderId===undefined) im.folderId=null;
    im.comments.forEach(c=>{ if(c.tx===undefined)c.tx=0; if(c.ty===undefined)c.ty=8; }); });
  if(!state.boards.length) state.boards.push(newBoardObj("ボード 1"));
  state.boards.forEach(b=> b.items.forEach(it=>{ if(it.flipH===undefined)it.flipH=false; if(it.flipV===undefined)it.flipV=false; }));
  if(!state.currentBoardId||!state.boards.find(b=>b.id===state.currentBoardId)) state.currentBoardId=state.boards[0].id;
  if(state.currentFolderId&&!state.folders.find(f=>f.id===state.currentFolderId)) state.currentFolderId=null;
}
function save(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }
  catch(e){ toast("保存に失敗（容量超過の可能性）"); console.error(e);} }
function newBoardObj(name){ return {id:uid(),name,showAllComments:false,camera:{x:0,y:0,zoom:1},items:[]}; }
function curBoard(){ return state.boards.find(b=>b.id===state.currentBoardId); }
function imgById(id){ return state.images.find(i=>i.id===id); }
function folderById(id){ return state.folders.find(f=>f.id===id); }

let toastTimer;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200); }

// ============ VIEW / HEADER ============
function setView(v){
  state.currentView=v; save();
  document.getElementById("galleryView").classList.toggle("active",v==="gallery");
  document.getElementById("boardView").classList.toggle("active",v==="board");
  document.getElementById("tabGallery").classList.toggle("active",v==="gallery");
  document.getElementById("tabBoard").classList.toggle("active",v==="board");
  document.getElementById("galCtrls").style.display=v==="gallery"?"flex":"none";
  document.getElementById("boardCtrls").style.display=v==="board"?"flex":"none";
  if(v==="board"){ renderBoardSelect(); renderBoard(); } else renderGallery();
}
function toggleHeader(){ document.body.classList.toggle("header-hidden"); }

// ============ UPLOAD / PASTE ============
function onUpload(e){
  const files=[...e.target.files]; if(!files.length) return;
  let pending=files.length;
  files.forEach(f=>{
    if(!f.type.startsWith("image/")){ pending--; return; }
    const r=new FileReader();
    r.onload=()=>{ addImage(r.result,f.name); if(--pending===0){ save(); renderGallery(); toast("画像を追加しました"); } };
    r.onerror=()=>{ if(--pending===0){ save(); renderGallery(); } };
    r.readAsDataURL(f);
  });
  e.target.value="";
}
function addImage(src,name,folderId){
  const im={id:uid(),src,name:name||"pasted.png",
    folderId: folderId!==undefined?folderId:(state.currentView==="gallery"?state.currentFolderId:null),
    comments:[]};
  state.images.push(im); return im;
}
function onPaste(e){
  const items=e.clipboardData&&e.clipboardData.items; if(!items) return;
  const imgs=[...items].filter(it=>it.type.startsWith("image/"));
  if(!imgs.length) return;
  e.preventDefault();
  let pending=imgs.length;
  imgs.forEach(it=>{
    const f=it.getAsFile(); if(!f){ pending--; return; }
    const r=new FileReader();
    r.onload=()=>{
      const im=addImage(r.result,"clipboard-"+Date.now()+".png");
      if(state.currentView==="board") placeOnBoardCenter(im.id);
      if(--pending===0){ save(); state.currentView==="board"?renderBoard():renderGallery(); toast("貼り付けました"); }
    };
    r.onerror=()=>{ if(--pending===0){ save(); } };
    r.readAsDataURL(f);
  });
}

// ============ FOLDERS ============
function newFolder(){
  const name=prompt("フォルダ名","新しいフォルダ"); if(name===null) return;
  state.folders.push({id:uid(),name:name.trim()||"新しいフォルダ",parentId:state.currentFolderId});
  save(); renderGallery();
}
function openFolder(id){ state.currentFolderId=id; save(); renderGallery(); }
function renameFolder(id){
  const f=folderById(id); const n=prompt("フォルダ名を変更",f.name); if(n===null) return;
  f.name=n.trim()||f.name; save(); renderGallery();
}
function deleteFolder(id){
  const f=folderById(id);
  if(!confirm("フォルダ「"+f.name+"」を削除します。中身は親フォルダに移動します。")) return;
  state.images.forEach(im=>{ if(im.folderId===id) im.folderId=f.parentId; });
  state.folders.forEach(sf=>{ if(sf.parentId===id) sf.parentId=f.parentId; });
  state.folders=state.folders.filter(x=>x.id!==id);
  save(); renderGallery();
}
function isDescendant(folderId,maybeAncestorId){
  let cur=folderById(folderId);
  while(cur){ if(cur.parentId===maybeAncestorId) return true; cur=folderById(cur.parentId); }
  return false;
}
function moveInto(payload,targetFolderId){
  if(payload.type==="image"){
    const im=imgById(payload.id); if(im) im.folderId=targetFolderId;
  }else if(payload.type==="folder"){
    if(payload.id===targetFolderId) return;
    if(targetFolderId&&isDescendant(targetFolderId,payload.id)) { toast("フォルダを自身の中へは移動できません"); return; }
    const f=folderById(payload.id); if(f) f.parentId=targetFolderId;
  }
  save(); renderGallery();
}

// ============ GALLERY RENDER ============
function folderPath(id){ const p=[]; let c=folderById(id); while(c){ p.unshift(c); c=folderById(c.parentId);} return p; }
function renderCrumbs(){
  const c=document.getElementById("crumbs"); c.innerHTML="";
  const mk=(label,fid)=>{
    const el=document.createElement("div"); el.className="crumb"; el.textContent=label;
    el.onclick=()=>openFolder(fid);
    el.ondragover=e=>{e.preventDefault();el.classList.add("drop");};
    el.ondragleave=()=>el.classList.remove("drop");
    el.ondrop=e=>{e.preventDefault();el.classList.remove("drop");handleDrop(e,fid);};
    return el;
  };
  c.appendChild(mk("🏠 すべて",null));
  folderPath(state.currentFolderId).forEach(f=>{
    const s=document.createElement("span"); s.className="crumb-sep"; s.textContent="›"; c.appendChild(s);
    c.appendChild(mk("📁 "+f.name,f.id));
  });
}
function handleDrop(e,targetFolderId){
  try{ const p=JSON.parse(e.dataTransfer.getData("text/plain")); moveInto(p,targetFolderId); }catch(_){}
}
function renderGallery(){
  renderCrumbs();
  const grid=document.getElementById("galGrid");
  const empty=document.getElementById("galEmpty");
  grid.innerHTML="";
  const subFolders=state.folders.filter(f=>(f.parentId||null)===(state.currentFolderId||null));
  const imgs=state.images.filter(im=>(im.folderId||null)===(state.currentFolderId||null));
  empty.style.display=(subFolders.length||imgs.length)?"none":"block";

  subFolders.forEach(f=>{
    const count=state.images.filter(im=>im.folderId===f.id).length
      + state.folders.filter(x=>x.parentId===f.id).length;
    const card=document.createElement("div"); card.className="folder-card";
    card.draggable=true;
    card.ondragstart=e=>e.dataTransfer.setData("text/plain",JSON.stringify({type:"folder",id:f.id}));
    card.ondragover=e=>{e.preventDefault();card.classList.add("drop");};
    card.ondragleave=()=>card.classList.remove("drop");
    card.ondrop=e=>{e.preventDefault();card.classList.remove("drop");handleDrop(e,f.id);};
    card.onclick=()=>openFolder(f.id);
    const ic=document.createElement("div"); ic.className="ficon"; ic.textContent="📁";
    const meta=document.createElement("div"); meta.className="fmeta";
    const nm=document.createElement("div"); nm.className="fname"; nm.textContent=f.name+" ("+count+")"; nm.title=f.name;
    const rn=document.createElement("button"); rn.className="iconbtn"; rn.textContent="✏️";
    rn.onclick=e=>{e.stopPropagation();renameFolder(f.id);};
    const dl=document.createElement("button"); dl.className="iconbtn del"; dl.textContent="🗑";
    dl.onclick=e=>{e.stopPropagation();deleteFolder(f.id);};
    meta.appendChild(nm); meta.appendChild(rn); meta.appendChild(dl);
    card.appendChild(ic); card.appendChild(meta); grid.appendChild(card);
  });

  imgs.forEach(img=>{
    const card=document.createElement("div");
    card.className="card"+(selected.has(img.id)?" selected":"");
    card.draggable=true;
    card.ondragstart=e=>{ e.dataTransfer.setData("text/plain",JSON.stringify({type:"image",id:img.id})); card.classList.add("dragging"); };
    card.ondragend=()=>card.classList.remove("dragging");
    const order=[...selected].indexOf(img.id)+1;
    const wrap=document.createElement("div"); wrap.className="imgwrap"; wrap.onclick=()=>toggleSelect(img.id);
    const im=document.createElement("img"); im.src=img.src; im.alt=img.name; wrap.appendChild(im);
    renderBubbles(wrap,img,{mode:"mini"});
    const badge=document.createElement("div"); badge.className="badge"; badge.textContent=order; wrap.appendChild(badge);
    if(img.comments.length){ const cc=document.createElement("div"); cc.className="cmt-count"; cc.textContent="💬 "+img.comments.length; wrap.appendChild(cc); }
    card.appendChild(wrap);
    const meta=document.createElement("div"); meta.className="meta";
    const nm=document.createElement("div"); nm.className="name"; nm.textContent=img.name; nm.title=img.name;
    const eb=document.createElement("button"); eb.className="iconbtn"; eb.textContent="💬 編集";
    eb.onclick=ev=>{ev.stopPropagation();openEditor(img.id);};
    const db=document.createElement("button"); db.className="iconbtn del"; db.textContent="🗑";
    db.onclick=ev=>{ev.stopPropagation();deleteImage(img.id);};
    meta.appendChild(nm); meta.appendChild(eb); meta.appendChild(db);
    card.appendChild(meta); grid.appendChild(card);
  });
  updateSelInfo();
}
function toggleSelect(id){ selected.has(id)?selected.delete(id):selected.add(id); renderGallery(); }
function clearSelection(){ selected.clear(); renderGallery(); }
function updateSelInfo(){
  document.getElementById("selInfo").textContent=selected.size+"枚選択中";
  document.getElementById("openBoardBtn").disabled=selected.size===0;
}
function deleteImage(id){
  if(!confirm("この画像を削除しますか？ボード上の配置も削除されます。")) return;
  state.images=state.images.filter(i=>i.id!==id); selected.delete(id);
  state.boards.forEach(b=> b.items=b.items.filter(it=>it.imageId!==id));
  save(); renderGallery();
}

// ============ BUBBLES (shared) ============
function tailPoints(c){
  const tx=c.tx||0, ty=(c.ty===undefined?8:c.ty);
  const ax=c.x, ay=c.y, tpx=c.x+tx, tpy=c.y+ty;
  let dx=tpx-ax, dy=tpy-ay; const len=Math.hypot(dx,dy)||1;
  const bw=2.6, px=-dy/len*bw, py=dx/len*bw;
  return (ax+px)+","+(ay+py)+" "+(ax-px)+","+(ay-py)+" "+tpx+","+tpy;
}
// mode: "mini" | "board" | "edit"
function renderBubbles(container,img,opt){
  container.querySelectorAll(".tail-layer,.edit-bubble,.board-bubble,.mini-bubble,.tip-handle").forEach(n=>n.remove());
  if(!img.comments.length) return;
  const svg=document.createElementNS(SVGNS,"svg");
  svg.setAttribute("class","tail-layer");
  svg.setAttribute("viewBox","0 0 100 100");
  svg.setAttribute("preserveAspectRatio","none");
  img.comments.forEach(c=>{
    const poly=document.createElementNS(SVGNS,"polygon");
    poly.setAttribute("points",tailPoints(c));
    poly.setAttribute("fill","rgba(28,32,40,0.82)");
    poly.setAttribute("stroke","rgba(255,255,255,0.22)");
    poly.setAttribute("stroke-width","1");
    poly.setAttribute("vector-effect","non-scaling-stroke");
    poly.dataset.cid=c.id;
    svg.appendChild(poly);
  });
  container.appendChild(svg);

  img.comments.forEach(c=>{
    const b=document.createElement("div");
    b.style.left=c.x+"%"; b.style.top=c.y+"%"; b.dataset.cid=c.id;
    if(opt.mode==="edit"){
      b.className="edit-bubble";
      const ta=document.createElement("textarea"); ta.rows=1; ta.value=c.text; ta.placeholder="コメント...";
      const ar=()=>{ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";};
      ta.oninput=()=>{c.text=ta.value;ar();save();}; setTimeout(ar,0);
      ta.onpointerdown=e=>e.stopPropagation();
      const tools=document.createElement("div"); tools.className="bub-tools";
      const del=document.createElement("button"); del.className="del"; del.textContent="✕";
      del.onpointerdown=e=>e.stopPropagation();
      del.onclick=e=>{e.stopPropagation(); img.comments=img.comments.filter(x=>x.id!==c.id); save(); renderEditorBubbles();};
      tools.appendChild(del); b.appendChild(tools); b.appendChild(ta);
      // drag bubble body
      b.onpointerdown=e=>{
        if(e.target===ta||e.target===del) return; e.preventDefault();
        const move=ev=>{ const r=container.getBoundingClientRect();
          c.x=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));
          c.y=Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));
          b.style.left=c.x+"%"; b.style.top=c.y+"%"; updateTail(svg,c); positionTip(container,c); };
        const up=()=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);save();};
        document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
      };
      container.appendChild(b);
      // tip handle
      const tip=document.createElement("div"); tip.className="tip-handle"; tip.dataset.cid=c.id;
      positionTipEl(tip,c);
      tip.onpointerdown=e=>{
        e.stopPropagation(); e.preventDefault();
        const move=ev=>{ const r=container.getBoundingClientRect();
          const px=(ev.clientX-r.left)/r.width*100, py=(ev.clientY-r.top)/r.height*100;
          c.tx=px-c.x; c.ty=py-c.y; positionTipEl(tip,c); updateTail(svg,c); };
        const up=()=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);save();};
        document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
      };
      container.appendChild(tip);
    }else{
      b.className= opt.mode==="mini"?"mini-bubble":"board-bubble";
      if(opt.mode==="mini"){ b.style.fontSize="9px"; b.style.maxWidth="80px"; b.style.padding="2px 6px"; }
      b.textContent=c.text||"…";
      container.appendChild(b);
    }
  });
}
function updateTail(svg,c){ const p=svg.querySelector('polygon[data-cid="'+c.id+'"]'); if(p) p.setAttribute("points",tailPoints(c)); }
function positionTipEl(tip,c){ tip.style.left=(c.x+(c.tx||0))+"%"; tip.style.top=(c.y+(c.ty===undefined?8:c.ty))+"%"; }
function positionTip(container,c){ const t=container.querySelector('.tip-handle[data-cid="'+c.id+'"]'); if(t) positionTipEl(t,c); }
// mini bubble base style
const styleEl=document.createElement("style");
styleEl.textContent=".mini-bubble{position:absolute;transform:translate(-50%,-100%);background:rgba(30,34,42,.85);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:8px;pointer-events:none;line-height:1.3;z-index:3}";
document.head.appendChild(styleEl);

// ============ EDITOR ============
function openEditor(id){
  editingImageId=id; const img=imgById(id);
  const ei=document.getElementById("editorImg");
  ei.onload=()=>renderEditorBubbles(); ei.src=img.src;
  if(ei.complete) renderEditorBubbles();
  document.getElementById("modalBg").classList.add("open");
}
function renderEditorBubbles(){ const img=imgById(editingImageId); if(img) renderBubbles(document.getElementById("editorStage"),img,{mode:"edit"}); }
function addBubbleCenter(){
  const img=imgById(editingImageId); if(!img) return;
  const c={id:uid(),x:50,y:50,text:"",tx:0,ty:8}; img.comments.push(c); save();
  renderEditorBubbles(); focusBubble(c.id);
}
function focusBubble(cid){ const b=document.querySelector('.edit-bubble[data-cid="'+cid+'"] textarea'); if(b) b.focus(); }
function closeModal(){ document.getElementById("modalBg").classList.remove("open"); editingImageId=null; renderGallery(); }
document.getElementById("editorStage").addEventListener("click",e=>{
  if(e.target.id!=="editorImg") return;
  const img=imgById(editingImageId); if(!img) return;
  const r=e.currentTarget.getBoundingClientRect();
  const c={id:uid(),x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100,text:"",tx:0,ty:8};
  img.comments.push(c); save(); renderEditorBubbles(); focusBubble(c.id);
});

// ============ OPEN IN BOARD ============
function openSelectedInBoard(){
  if(!selected.size){ toast("画像を選択してください"); return; }
  const board=curBoard(); let placed=board.items.length; const cols=4,gap=40,bw=260; let added=0;
  selected.forEach(id=>{
    if(board.items.find(it=>it.imageId===id)) return;
    const idx=placed+added, col=idx%cols, row=Math.floor(idx/cols);
    board.items.push({imageId:id,x:col*(bw+gap)+gap,y:row*(bw+gap)+gap,scale:1,showComments:false,flipH:false,flipV:false});
    added++;
  });
  save(); toast(added>0?added+"枚をボードに追加":"すべて配置済みです"); setView("board");
}

// ============ BOARD ============
function renderBoardSelect(){
  const sel=document.getElementById("boardSelect"); sel.innerHTML="";
  state.boards.forEach(b=>{ const o=document.createElement("option"); o.value=b.id;
    o.textContent=b.name+" ("+b.items.length+")"; if(b.id===state.currentBoardId)o.selected=true; sel.appendChild(o); });
}
function switchBoard(id){ state.currentBoardId=id; save(); renderBoard(); }
function newBoard(){ const n=prompt("新しいボード名","ボード "+(state.boards.length+1)); if(n===null)return;
  const b=newBoardObj(n.trim()||"ボード "+(state.boards.length+1)); state.boards.push(b); state.currentBoardId=b.id; save(); renderBoardSelect(); renderBoard(); }
function renameBoard(){ const b=curBoard(); const n=prompt("ボード名を変更",b.name); if(n===null)return; b.name=n.trim()||b.name; save(); renderBoardSelect(); }
function deleteBoard(){ if(state.boards.length<=1){toast("最後のボードは削除できません");return;}
  if(!confirm("このボードを削除しますか？"))return;
  state.boards=state.boards.filter(b=>b.id!==state.currentBoardId); state.currentBoardId=state.boards[0].id; save(); renderBoardSelect(); renderBoard(); }

let boardSelItem=null;
function renderBoard(){
  const board=curBoard(); const canvas=document.getElementById("boardCanvas"); canvas.innerHTML="";
  document.getElementById("boardEmpty").style.display=board.items.length?"none":"flex";
  document.getElementById("allCmtBtn").textContent=board.showAllComments?"💬 コメント一括非表示":"💬 コメント一括表示";
  applyCamera();
  board.items.forEach(it=>{
    const img=imgById(it.imageId); if(!img) return;
    const node=document.createElement("div");
    node.className="board-item"+(boardSelItem===it.imageId?" sel":""); node.dataset.id=it.imageId;
    positionItem(node,it);
    const im=document.createElement("img"); im.src=img.src; im.alt=img.name; im.draggable=false;
    im.style.transform="scale("+(it.flipH?-1:1)+","+(it.flipV?-1:1)+")"; node.appendChild(im);

    const tb=document.createElement("div"); tb.className="item-toolbar";
    const cbtn=document.createElement("button");
    cbtn.textContent=(it.showComments?"💬非表示":"💬表示")+" ("+img.comments.length+")";
    cbtn.onpointerdown=e=>e.stopPropagation();
    cbtn.onclick=e=>{e.stopPropagation();it.showComments=!it.showComments;save();renderBoard();};
    const fh=document.createElement("button"); fh.textContent="⇄ 左右反転"; fh.onpointerdown=e=>e.stopPropagation();
    fh.onclick=e=>{e.stopPropagation();it.flipH=!it.flipH;save();renderBoard();};
    const fv=document.createElement("button"); fv.textContent="⇅ 上下反転"; fv.onpointerdown=e=>e.stopPropagation();
    fv.onclick=e=>{e.stopPropagation();it.flipV=!it.flipV;save();renderBoard();};
    const fr=document.createElement("button"); fr.textContent="最前面"; fr.onpointerdown=e=>e.stopPropagation();
    fr.onclick=e=>{e.stopPropagation();board.items=board.items.filter(x=>x!==it);board.items.push(it);save();renderBoard();};
    const rm=document.createElement("button"); rm.textContent="外す"; rm.onpointerdown=e=>e.stopPropagation();
    rm.onclick=e=>{e.stopPropagation();board.items=board.items.filter(x=>x!==it);boardSelItem=null;save();renderBoard();renderBoardSelect();};
    [cbtn,fh,fv,fr,rm].forEach(x=>tb.appendChild(x)); node.appendChild(tb);

    const handle=document.createElement("div"); handle.className="handle"; node.appendChild(handle);
    if(board.showAllComments||it.showComments) renderBubbles(node,img,{mode:"board"});
    setupItemDrag(node,it,handle); canvas.appendChild(node);
  });
}
function positionItem(node,it){ node.style.left=it.x+"px"; node.style.top=it.y+"px"; node.style.width=(260*it.scale)+"px"; node.style.height="auto"; }
function setupItemDrag(node,it,handle){
  node.addEventListener("pointerdown",e=>{
    if(e.target===handle||e.target.tagName==="BUTTON") return; e.stopPropagation();
    boardSelItem=it.imageId;
    [...document.querySelectorAll(".board-item")].forEach(n=>n.classList.toggle("sel",n.dataset.id===it.imageId));
    const cam=curBoard().camera, sx=e.clientX, sy=e.clientY, ox=it.x, oy=it.y; let moved=false;
    const move=ev=>{ moved=true; it.x=ox+(ev.clientX-sx)/cam.zoom; it.y=oy+(ev.clientY-sy)/cam.zoom;
      node.style.left=it.x+"px"; node.style.top=it.y+"px"; };
    const up=()=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);if(moved)save();};
    document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
  });
  handle.addEventListener("pointerdown",e=>{
    e.stopPropagation(); const cam=curBoard().camera, sx=e.clientX, os=it.scale;
    const move=ev=>{ const dw=(ev.clientX-sx)/cam.zoom; it.scale=Math.max(0.15,os+dw/260); positionItem(node,it); };
    const up=()=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);save();};
    document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
  });
}
function applyCamera(){ const c=curBoard().camera;
  document.getElementById("boardCanvas").style.transform="translate("+c.x+"px,"+c.y+"px) scale("+c.zoom+")"; }
function placeOnBoardCenter(imageId){
  const board=curBoard(), cam=board.camera, rect=boardView.getBoundingClientRect();
  const cx=(rect.width/2-cam.x)/cam.zoom, cy=(rect.height/2-cam.y)/cam.zoom;
  board.items.push({imageId,x:cx-130,y:cy-130,scale:1,showComments:false,flipH:false,flipV:false});
}

const boardView=document.getElementById("boardView");
boardView.addEventListener("pointerdown",e=>{
  if(e.target.id!=="boardView"&&e.target.id!=="boardCanvas"&&e.target.id!=="boardEmpty") return;
  boardSelItem=null; [...document.querySelectorAll(".board-item")].forEach(n=>n.classList.remove("sel"));
  boardView.classList.add("panning"); const cam=curBoard().camera, sx=e.clientX, sy=e.clientY, ox=cam.x, oy=cam.y;
  const move=ev=>{cam.x=ox+(ev.clientX-sx);cam.y=oy+(ev.clientY-sy);applyCamera();};
  const up=()=>{boardView.classList.remove("panning");document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);save();};
  document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
});
boardView.addEventListener("wheel",e=>{ e.preventDefault(); const r=boardView.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12); },{passive:false});
function zoomAt(mx,my,factor){ const cam=curBoard().camera; const nz=Math.max(0.1,Math.min(8,cam.zoom*factor));
  const k=nz/cam.zoom; cam.x=mx-(mx-cam.x)*k; cam.y=my-(my-cam.y)*k; cam.zoom=nz; applyCamera(); save(); }
function boardZoom(f){ const r=boardView.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,f); }
let pinch=null;
boardView.addEventListener("touchstart",e=>{ if(e.touches.length===2) pinch={d:dist(e.touches)}; },{passive:false});
boardView.addEventListener("touchmove",e=>{ if(e.touches.length===2&&pinch){ e.preventDefault();
  const nd=dist(e.touches), r=boardView.getBoundingClientRect();
  const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left, my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
  zoomAt(mx,my,nd/pinch.d); pinch.d=nd; } },{passive:false});
boardView.addEventListener("touchend",e=>{ if(e.touches.length<2) pinch=null; });
function dist(t){ return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY); }
function toggleAllComments(){ const b=curBoard(); b.showAllComments=!b.showAllComments; save(); renderBoard(); }
function boardFit(){
  const b=curBoard(); if(!b.items.length){ b.camera={x:40,y:40,zoom:1}; applyCamera(); save(); return; }
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  b.items.forEach(it=>{ const w=260*it.scale; minX=Math.min(minX,it.x); minY=Math.min(minY,it.y); maxX=Math.max(maxX,it.x+w); maxY=Math.max(maxY,it.y+w); });
  const r=boardView.getBoundingClientRect(), pad=60;
  const z=Math.min((r.width-pad*2)/(maxX-minX),(r.height-pad*2)/(maxY-minY),3);
  b.camera.zoom=Math.max(0.1,z); b.camera.x=pad-minX*b.camera.zoom; b.camera.y=pad-minY*b.camera.zoom; applyCamera(); save();
}

// ============ RESET ============
function resetAll(){
  if(!confirm("すべてのデータ（画像・フォルダ・コメント・ボード）を削除します。よろしいですか？")) return;
  localStorage.removeItem(LS_KEY); localStorage.removeItem("illustRefApp.v1");
  state={images:[],folders:[],boards:[],currentBoardId:null,currentFolderId:null,currentView:"gallery"};
  state.boards.push(newBoardObj("ボード 1")); state.currentBoardId=state.boards[0].id;
  selected.clear(); save(); setView("gallery"); toast("初期化しました");
}

window.App={ setView,toggleHeader,onUpload,newFolder,clearSelection,openSelectedInBoard,openEditor,
  addBubbleCenter,closeModal,switchBoard,newBoard,renameBoard,deleteBoard,toggleAllComments,boardFit,boardZoom,resetAll };

load(); setView(state.currentView||"gallery");
document.getElementById("modalBg").addEventListener("click",e=>{ if(e.target.id==="modalBg") closeModal(); });
window.addEventListener("paste",onPaste);
})();
